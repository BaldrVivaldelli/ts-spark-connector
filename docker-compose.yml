services:
  spark:
    build:
      context: .
      dockerfile: spark-server/Dockerfile
      args:
        SPARK_VERSION: "${SPARK_VERSION:-4.0.4}"
        SPARK_AVRO_SHA256: "${SPARK_AVRO_SHA256:-f2862c13564bf6cd78cfdfe7b902ef07e68d1d6a5edd9fde336c0cf0fcdb8c55}"
    # TLS is enabled by default. For trusted local plaintext debugging, combine
    # this file with docker-compose.plain.yml.
    environment:
      SPARK_ROLE: connect
      SPARK_CONNECT_PORT: "15002"
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "15002:15002"   # Spark Connect gRPC
      - "4040:4040"     # Spark UI
    volumes:
      - ./example_data:/data:ro          # Input fixtures
      - spark-output:/data/dest           # Writable Parquet/CSV/JSON/ORC output
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 15002 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  spark-output:
