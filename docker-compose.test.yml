services:
  spark:
    build:
      context: .
      dockerfile: spark-server/Dockerfile
      args:
        SPARK_VERSION: "${SPARK_VERSION:-4.0.4}"
        SPARK_AVRO_SHA256: "${SPARK_AVRO_SHA256:-f2862c13564bf6cd78cfdfe7b902ef07e68d1d6a5edd9fde336c0cf0fcdb8c55}"
    ports:
      - "15002:15002"   # Spark Connect gRPC port
      - "4040:4040"     # Spark UI (optional)
    # The E2E compatibility gate intentionally exercises the default TLS
    # profile on each Spark version selected by the CI compatibility matrix.
    environment:
      SPARK_CONNECT_PORT: "15002"
      SPARK_CONNECT_BACKEND_PORT: "15003"
      SPARK_CONNECT_TLS_ENABLED: "true"
      SPARK_NO_DAEMONIZE: "true"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "15002"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - test-network

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      spark:
        condition: service_healthy
    environment:
      SPARK_CONNECT_URL: scs://spark:15002
      SPARK_TLS_CA: /app/spark-server/certs/ca.crt
      SPARK_TLS_SERVER_NAME: spark-connect
      SPARK_TEST_DEST: /data/dest/e2e
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
