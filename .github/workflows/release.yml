name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [next]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'next'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify tested SHA is still next
        id: tested-sha
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "Checkout does not match the SHA tested by CI" >&2
            exit 1
          fi

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/next:refs/remotes/origin/next"
          if [ "$(git rev-parse "origin/$RELEASE_BRANCH")" != "$TESTED_SHA" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_BRANCH advanced after this CI run; a newer workflow_run will release it"
            exit 0
          fi

          git switch --force-create "$RELEASE_BRANCH" "$TESTED_SHA"
          for configured_branch in main next; do
            if [ "$configured_branch" != "$RELEASE_BRANCH" ]; then
              git branch --force "$configured_branch" "origin/$configured_branch"
            fi
          done
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.tested-sha.outputs.eligible == 'true'
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install the tested source tree
        if: steps.tested-sha.outputs.eligible == 'true'
        run: npm ci

      - name: Generate production SBOM
        if: steps.tested-sha.outputs.eligible == 'true'
        run: npm run --silent sbom > sbom.cdx.json

      - name: Semantic Release
        id: semantic_release
        if: steps.tested-sha.outputs.eligible == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -o pipefail
          npx semantic-release 2>&1 | tee semantic-release.log

      - name: Publish release diagnostics
        if: steps.semantic_release.outcome == 'failure'
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const log = fs.readFileSync("semantic-release.log", "utf8")
            .replaceAll(/\u001b\[[0-9;]*m/g, "")
            .split(/\r?\n/u)
            .filter(line => /error|fail|forbidden|unauthorized|E[A-Z]{3,}/iu.test(line))
            .slice(-20);
          const diagnostic = (log.length ? log : ["semantic-release failed without a diagnostic line"])
            .join(" | ")
            .replaceAll(/[A-Za-z0-9_=-]{36,}/gu, "***REDACTED***")
            .replaceAll("%", "%25")
            .replaceAll("\r", "%0D")
            .replaceAll("\n", "%0A");
          console.log(`::error title=Semantic Release diagnostics::${diagnostic}`);
          NODE
          exit 1

      - name: Observe the published canary
        if: >-
          steps.tested-sha.outputs.eligible == 'true' &&
          steps.semantic_release.outcome == 'success'
        run: node scripts/observe-canary.mjs

      - name: Upload canary observation
        if: >-
          always() &&
          steps.tested-sha.outputs.eligible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: canary-observation-${{ github.event.workflow_run.head_sha }}
          path: artifacts/canary
          if-no-files-found: warn
          retention-days: 30
