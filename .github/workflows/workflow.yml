name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Node 22 ships npm 10 and Node 24 ships npm 11, and the two disagree on how
      # optional peer dependencies are recorded, so no single lockfile satisfies
      # both: a lockfile written by npm 11 makes npm 10 fail `npm ci` with
      # "Missing: conventional-commits-filter". Pin every job to one major.
      - name: Pin npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run lint:commit

      - name: Verify TypeScript 7 toolchain
        run: npm run check:typescript

      - name: Typecheck source
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Typecheck executable examples
        run: npm run typecheck:examples

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Coverage gate
        if: matrix.node == 22
        run: npm run test:coverage

      - name: Verify Spark protocol manifest
        run: npm run test:proto

  package:
    name: Publishable tarball
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10 and Node 24 ships npm 11, and the two disagree on how
      # optional peer dependencies are recorded, so no single lockfile satisfies
      # both: a lockfile written by npm 11 makes npm 10 fail `npm ci` with
      # "Missing: conventional-commits-filter". Pin every job to one major.
      - name: Pin npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Test packed CJS, ESM, and type consumers
        run: npm run test:package

      - name: Validate package metadata and module types
        run: npm run package:lint

      - name: Verify the public API report
        run: npm run api:check

      - name: Validate production SBOM
        run: |
          npm run --silent sbom > sbom.cdx.json
          node -e 'const fs=require("node:fs"); const sbom=JSON.parse(fs.readFileSync("sbom.cdx.json","utf8")); if (sbom.bomFormat !== "CycloneDX") process.exit(1)'

      - name: Smoke plan-compilation benchmark
        run: npm run benchmark
        env:
          SPARK_PLAN_BENCH_ITERATIONS: 5000

  e2e:
    name: E2E / Spark ${{ matrix.spark }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: 4.0.0
            avro-sha256: 083fb13d7a1091025b135eff216e2009b42c9724bb8bc597d2f28b1207ef4709
          - spark: 4.0.4
            avro-sha256: f2862c13564bf6cd78cfdfe7b902ef07e68d1d6a5edd9fde336c0cf0fcdb8c55
    env:
      SPARK_VERSION: ${{ matrix.spark }}
      SPARK_AVRO_SHA256: ${{ matrix.avro-sha256 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10 and Node 24 ships npm 11, and the two disagree on how
      # optional peer dependencies are recorded, so no single lockfile satisfies
      # both: a lockfile written by npm 11 makes npm 10 fail `npm ci` with
      # "Missing: conventional-commits-filter". Pin every job to one major.
      - name: Pin npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Prepare writable Spark output
        run: mkdir -p example_data/dest artifacts/e2e

      - name: Boot Spark
        run: docker compose -f docker-compose.yml up --build --detach --wait spark

      - name: Run E2E tests
        id: e2e
        run: |
          set -o pipefail
          npm run test:e2e -- \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit="artifacts/e2e/spark-${SPARK_VERSION}.xml" \
            2>&1 | tee "artifacts/e2e/spark-${SPARK_VERSION}-vitest.log"
        env:
          SPARK_CONNECT_URL: scs://127.0.0.1:15002
          SPARK_TLS_CA: ./spark-server/certs/ca.crt
          SPARK_TLS_SERVER_NAME: spark-connect
          SPARK_TEST_DEST: /data/dest/ci

      - name: Run an installed-package example
        id: example
        if: always()
        run: |
          set -o pipefail
          npm run examples:run -- join \
            2>&1 | tee "artifacts/e2e/spark-${SPARK_VERSION}-example.log"
        env:
          SPARK_CONNECT_URL: scs://127.0.0.1:15002
          SPARK_TLS_CA: ./spark-server/certs/ca.crt
          SPARK_TLS_SERVER_NAME: spark-connect

      - name: Capture Spark logs on failure
        if: failure()
        continue-on-error: true
        run: >-
          docker compose -f docker-compose.yml logs --no-color spark
          > "artifacts/e2e/spark-${SPARK_VERSION}.log"

      - name: Publish E2E job summary
        if: always()
        env:
          E2E_TEST_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_EXAMPLE_OUTCOME: ${{ steps.example.outcome }}
          E2E_JUNIT_PATH: artifacts/e2e/spark-${{ matrix.spark }}.xml
        run: node scripts/publish-e2e-report.mjs

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-spark-${{ matrix.spark }}
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 30

      - name: Stop Spark
        if: always()
        run: docker compose -f docker-compose.yml down --volumes

  release:
    name: Release
    needs: [unit, package, e2e]
    # Runs here, on the real push, rather than in a separate workflow_run. npm
    # builds its provenance predicate from the same environment variables the
    # registry then verifies against the OIDC token, so the spoofed GITHUB_REF and
    # GITHUB_EVENT_NAME that the workflow_run indirection needed made provenance
    # impossible to satisfy (E422, invalid SLSA predicate). needs: also ties the
    # release to the exact commit these jobs tested.
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # Two pushes landing close together must not publish at the same time; the
    # freshness check below then retires whichever run is no longer at the tip.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the branch still points at this commit
        id: freshness
        run: |
          git fetch origin \
            "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"

          if [ "$(git rev-parse "origin/$GITHUB_REF_NAME")" != "$GITHUB_SHA" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME advanced past $GITHUB_SHA; the newer run releases it"
            exit 0
          fi

          # semantic-release resolves its configured branch from a local ref.
          git switch --force-create "$GITHUB_REF_NAME" "$GITHUB_SHA"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.freshness.outputs.eligible == 'true'
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm provenance needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm
        if: steps.freshness.outputs.eligible == 'true'
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install the released source tree
        if: steps.freshness.outputs.eligible == 'true'
        run: npm ci

      # The observation and the soak gate exist to guard a publication, so asking a
      # commit that publishes nothing to satisfy them only ever produced a red run.
      # When a release IS due both still run, unchanged.
      - name: Decide whether this commit releases
        id: pending
        if: steps.freshness.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          # A non-zero exit means semantic-release could not decide. Treating that as
          # "nothing to release" would skip a real release on a green run, so fail.
          if ! npx semantic-release --dry-run 2>&1 | tee dry-run.log; then
            echo "::error title=Release dry run failed::semantic-release could not determine whether a release is due"
            exit 1
          fi
          if grep -q "The next release version is" dry-run.log; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            grep "The next release version is" dry-run.log | tail -1
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release is due for $GITHUB_SHA"
          fi

      - name: Generate production SBOM
        if: steps.pending.outputs.release == 'true'
        run: npm run --silent sbom > sbom.cdx.json

      - name: Semantic Release
        id: semantic_release
        if: steps.pending.outputs.release == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -o pipefail
          npx semantic-release 2>&1 | tee semantic-release.log

          # semantic-release exits 0 when it decides there is nothing to release, so
          # only a real publication leaves something on the registry to observe.
          if grep -q "Published release" semantic-release.log; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            version="$(sed -n 's/.*Published release \([^ ]*\) on .*/\1/p' semantic-release.log | tail -1)"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "published $version"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "semantic-release published nothing for $GITHUB_SHA"
          fi

      # semantic-release pushes the tag before the publish plugins run, so a failed
      # publish strands a tag for a version that never reached npm, and it reads tags
      # to decide what is released, so it then skips that version for good. Diagnose
      # it here; never undo it automatically, because a publish npm has accepted but
      # not finished processing reads as a 404 for minutes.
      - name: Diagnose an orphaned release
        if: steps.semantic_release.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/diagnose-orphaned-release.mjs semantic-release.log

      - name: Publish release diagnostics
        if: steps.semantic_release.outcome == 'failure'
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const log = fs.readFileSync("semantic-release.log", "utf8")
            .replaceAll(/\u001b\[[0-9;]*m/g, "")
            .split(/\r?\n/u)
            .filter(line => /error|fail|forbidden|unauthorized|E[A-Z]{3,}/iu.test(line))
            .slice(-20);
          const diagnostic = (log.length ? log : ["semantic-release failed without a diagnostic line"])
            .join(" | ")
            .replaceAll(/[A-Za-z0-9_=-]{36,}/gu, "***REDACTED***")
            .replaceAll("%", "%25")
            .replaceAll("\r", "%0D")
            .replaceAll("\n", "%0A");
          console.log(`::error title=Semantic Release diagnostics::${diagnostic}`);
          NODE
          exit 1

      # With main the only release branch there is no canary to inspect before
      # publishing, and the next dist-tag is frozen at the last prerelease, so the old
      # pre-publish observation would have installed a stale tarball and the lineage
      # gate would have compared against it. Observe the artifact that actually went
      # out instead, pinned to its exact version so no dist-tag race can confuse it.
      - name: Observe the published release
        if: >-
          steps.semantic_release.outcome == 'success' &&
          steps.semantic_release.outputs.released == 'true'
        run: >-
          node scripts/observe-release.mjs
          "ts-spark-connector@${{ steps.semantic_release.outputs.version }}"

      - name: Upload the release observation
        if: always() && steps.pending.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-observation-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: warn
          retention-days: 30
