name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck source
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Verify Spark protocol manifest
        run: npm run test:proto

  package:
    name: Publishable tarball
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test packed CJS, ESM, and type consumers
        run: npm run test:package

      - name: Smoke plan-compilation benchmark
        run: npm run benchmark
        env:
          SPARK_PLAN_BENCH_ITERATIONS: 1000

  e2e:
    name: E2E / Spark 4.0.0
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare writable Spark output
        run: mkdir -p example_data/dest

      - name: Boot Spark
        run: docker compose -f docker-compose.yml up --build --detach --wait spark

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          SPARK_CONNECT_URL: scs://127.0.0.1:15002
          SPARK_TLS_CA: ./spark-server/certs/ca.crt
          SPARK_TLS_SERVER_NAME: spark-connect
          SPARK_TEST_DEST: /data/dest/ci

      - name: Run an installed-package example
        run: node -r ts-node/register docs/examples/join.ts
        env:
          SPARK_CONNECT_URL: scs://127.0.0.1:15002
          SPARK_TLS_CA: ./spark-server/certs/ca.crt
          SPARK_TLS_SERVER_NAME: spark-connect

      - name: Show Spark logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs spark

      - name: Stop Spark
        if: always()
        run: docker compose -f docker-compose.yml down --volumes
