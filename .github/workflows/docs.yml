name: API docs

# Builds the TypeDoc reference for every pull request so broken TSDoc links
# fail early, and publishes it to GitHub Pages from main. Publishing needs the
# repository's Pages source set to "GitHub Actions".
on:
  push:
    branches: [main]
  # Any base branch: stacked pull requests (a branch targeting another
  # feature branch) are checked too; releases still run only on main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # See workflow.yml: the lockfile is written by npm 11.
      - name: Pin npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build TypeDoc site
        run: npm run docs:api -- --treatWarningsAsErrors

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
