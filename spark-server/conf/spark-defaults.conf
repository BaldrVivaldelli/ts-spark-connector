# HAProxy terminates development TLS on port 15002. Spark Connect itself is
# bound only to the container loopback backend.
spark.connect.grpc.binding.address=127.0.0.1
spark.connect.grpc.binding.port=15003
spark.connect.grpc.ui.enabled=true
spark.sql.catalogImplementation=in-memory

# Local catalog/warehouse settings for disposable development data.
spark.sql.catalog.spark_catalog.type=hadoop
spark.sql.catalog.spark_catalog.warehouse=/tmp/warehouse

# Compatibility fallback used by Spark paths that read the legacy setting.
spark.sql.warehouse.dir=/tmp/warehouse
