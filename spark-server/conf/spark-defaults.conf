# HAProxy terminates development TLS on port 15002. Spark Connect itself is
# bound only to the container loopback backend (Spark 3.5 ignores the binding
# address and listens on every container interface; 15003 is not published).
spark.connect.grpc.binding.address=127.0.0.1
spark.connect.grpc.binding.port=15003
spark.connect.grpc.ui.enabled=true
spark.sql.catalogImplementation=in-memory

# Local catalog/warehouse settings for disposable development data.
spark.sql.catalog.spark_catalog.type=hadoop
spark.sql.catalog.spark_catalog.warehouse=/tmp/warehouse

# Compatibility fallback used by Spark paths that read the legacy setting.
spark.sql.warehouse.dir=/tmp/warehouse

# E2E reattach coverage: end every reattachable ExecutePlan response stream
# once ~6 MiB of responses were sent, so results larger than that force the
# client through ReattachExecute. This is a static conf (runtime set fails
# with CANNOT_MODIFY_CONFIG); results under 6 MiB are unaffected.
spark.connect.execute.reattachable.senderMaxStreamSize=6m

# E2E liveness coverage: end every reattachable response stream after 2 s
# (Spark's default is 2m) so a query that computes longer than that without
# producing a row is followed through many empty ReattachExecute streams.
spark.connect.execute.reattachable.senderMaxStreamDuration=2s

# Reliable checkpoints (`df.checkpoint()`) need a checkpoint directory; the
# E2E suite exercises them against this disposable location.
spark.checkpoint.dir=/tmp/checkpoints
